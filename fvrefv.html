
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
    // Skriv din kod här
    // en java script motor läser koderna du har skrivit i java script och sen kör de i en webläsare
       //opretasivsystem din webläsare pratar med din dator som sen senare skickar det till din procesor
      //  hårdvaran är näör din procesor räknar ut hur många pixlar
  // Programmering som denna kan användas inom digital utbildning och interaktiva simuleringar. Ett konkret exempel är trafiksäkerhetsspel där elever får öva på riskbedömning i en virtuell miljö. Systemet känner då av om användaren kolliderar med hinder, på samma sätt som zombierna i koden
  //Jag tycker att personlig integritet och datainsamling är den mest intressanta samhällsfrågan. Eftersom nästan all teknik samlar in och analyserar information om oss, uppstår viktiga frågor om vem som äger våra data. Det är en ständigt aktuell balansgång mellan teknisk nytta och rätten till ett privat liv.
  var player = { x: 100, y: 300, size: 20, color: "blue", speed: 4 };

var zombie1 = { x: 300, y: 220, speed: 2 };
var zombie2 = { x: 500, y: 400, speed: 3 };
var zombie3 = { x: 700, y: 260 };
var poang = 0;

// 
var enemies = [
    {x: 150, totalWidth, y: 550, totalHeight},
    {x: 400, totalWidth, y: 550, totalHeight},
    {x: 650, totalWidth, y: 550, totalHeight},
    {x: 750, totalWidth, y: 550, totalHeight},
    {x: 850, totalWidth, y: 550, totalHeight}
];
var star = [];

for(var i = 0; i < 5; i++) {
    star.push({x: random(0, totalWidth), y: random(0, totalHeight), size: 10, color: "gold"})
}

function power(x, y, s, c) {
    circle(x, y, s, c)
}
function drawZombie(x, y) {
  save();
  translate(x, y);
  rectangle(3, -10, 23, 65, "lightgreen");
  rectangle(3, -25, 23, 65, "gray");
  circle(15, -40, 20, "lightgreen");
  circle(0, -40, 3, "red");
  rectangle(-35, -20, 30, 14, "lightgreen");
  rectangle(-20, -20, 30, 14, "gray");
  restore();
}

function update() {
  clearScreen();
  if (keyboard.space) {
    enemies.push( {x: random(400, totalWidth, 700), y: random(650, totalHeight)})
  }
  text(20, 30, 24, "Zombiespelet", "black");

  drawZombie(zombie1.x, zombie1.y);
  drawZombie(zombie2.x, zombie2.y);
  drawZombie(zombie3.x, zombie3.y);

  circle(player.x, player.y, player.size, player.color);

  if (keyboard.right) {
    player.x = player.x + player.speed;
  }
  if (keyboard.left) {
    player.x = player.x - player.speed;
  }
  if (keyboard.up) {
    player.y = player.y - player.speed;
  }
  if (keyboard.down) {
    player.y = player.y + player.speed;
  }

  if (zombie1.x < player.x) {
    zombie1.x = zombie1.x + zombie1.speed;
  }
  if (zombie1.x > player.x) {
    zombie1.x = zombie1.x - zombie1.speed;
  }
  if (zombie1.y < player.y) {
    zombie1.y = zombie1.y + zombie1.speed;
  }
  if (zombie1.y > player.y) {
    zombie1.y = zombie1.y - zombie1.speed;
  }

  if (distance(player, zombie1) < 65) {
    text(280, 250, 50, "GAME OVER", "red");
    stopUpdate();
  } else {
    poang = poang + 1;
    text(20, 70, 24, "Poäng: " + poang, "black");
  }

  if (zombie2.x < player.x) {
    zombie2.x = zombie2.x + zombie2.speed;
  }
  if (zombie2.x > player.x) {
    zombie2.x = zombie2.x - zombie2.speed;
  }
  if (zombie2.y < player.y) {
    zombie2.y = zombie2.y + zombie2.speed;
  }
  if (zombie2.y > player.y) {
    zombie2.y = zombie2.y - zombie2.speed;
  }

  if (distance(player, zombie2) < 65) {
    text(280, 250, 50, "GAME OVER", "red");
    stopUpdate();
  } else {
    poang = poang + 1;
  }

  // STEG 2: loopen som ritar och kollar enemies kommer här
for(var i = 0; i < enemies.length; i++) {
    drawZombie(enemies[i].x, enemies[i].y);
    if (distance(player.x, player.y, enemies[i].x, enemies[i].y) < 65) {
        text(280, 250, 50, "game over", "red");
        stopUpdate();
    }
}

for(var i = 0; i < star.length; i++) {
    power(star[i].x, star[i].y, star[i].size, star[i].color)

if(distance(player.x, player.y, star[i].x, star[i].y,) < 10 ) {
    poang = poang + 100
    star.splice(i, 1)
}


}

}
</script>
</body>
</html>
