<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
    // Skriv din kod här
    var player = { x: 400, y: 300, size: 40, color: "blue", speed: 4 };
    function update() {
        clearScreen();

        if(player.x > totalWidth / 2) {
            fill("yellow")
            rectangle(totalWidth /2, 0, totalWidth /2, totalHeight, "green")
        } else {
            fill("green")
            rectangle(totalWidth /2, 0, totalWidth /2, totalHeight, "yellow")

        }


        circle(player.x, player.y, player.size, player.color);
        text(50, 50, 40, " x är: " + player.x + " y: är " + player.y, 10, 20, "white")
        if (keyboard.right) {
            player.x = player.x + player.speed;
        }
        if (keyboard.left) {
            player.x = player.x - player.speed;
        }
        if (keyboard.down) {
            player.y = player.y + player.speed;
        }
        if (keyboard.up) {
            player.y = player.y - player.speed;
        }
        if (player.x + player.size > totalWidth) { player.x = totalWidth - player.size; }
       //för det blir 0 ingen rörlse
       if(player.x - player.size < 0) {
        player.x = 0 + player.size
       } 
       if(player.y - player.size < 0) {
        player.y = 0 + player.size
       }
       if(player.y + player.size > totalHeight) {
        player.y = totalHeight - player.size
       }
       if (keyboard.space) {
        player.speed = 100;
       } else {
        player.speed = 4;
       }
       if(player.x > totalWidth - 100) {
        text(50, 100, 40, "Närmst")
        player.speed = player.speed - 1
       } else if(player.x > totalWidth - 300) {
        text(50, 100, 40, "närmre")
       } else if(player.x > totalWidth - 600) {
        text(50, 100, 40, "Nära")
        player.speed = player.speed - 1
       }

    }
  </script>
</body>
</html>
