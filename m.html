<!DOCTYPE html>
<html>
<head>
  <title>Rörlig cirkel</title>
  <style>
    body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { border: 2px solid #444; background: #1a1a1a; }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Cirkelns position och storlek
    let x = 400;
    let y = 300;
    const radius = 30;
    const speed = 5;          // Hur snabbt den rör sig

    // Rita cirkeln
    function draw() {
      // Rensa skärmen
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Rita cirkeln
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#00ff88';
      ctx.fill();
      ctx.closePath();
    }

    // Lyssna på tangenttryckningar
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') {
        y -= speed;
      }
      if (e.key === 'ArrowDown' || e.key === 's') {
        y += speed;
      }
      if (e.key === 'ArrowLeft' || e.key === 'a') {
        x -= speed;
      }
      if (e.key === 'ArrowRight' || e.key === 'd') {
        x += speed;
      }

      // Håll cirkeln innanför canvas
      if (x < radius) x = radius;
      if (x > canvas.width - radius) x = canvas.width - radius;
      if (y < radius) y = radius;
      if (y > canvas.height - radius) y = canvas.height - radius;

      draw();
    });

    // Rita första gången
    draw();
  const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Spelarens cirkel (grön)
let player = {
  x: 100,
  y: 300,
  radius: 25,
  speed: 5
};

// Fiende-cirkel (röd) – rör sig automatiskt
let enemy = {
  x: 700,
  y: 200,
  radius: 30,
  speedX: 3,
  speedY: 2.5
};

// Tangenterna som är nedtryckta
const keys = {};

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

// Kolla om två cirklar nuddar varandra
function collides(c1, c2) {
  const dx = c1.x - c2.x;
  const dy = c1.y - c2.y;
  const distance = Math.sqrt(dx * dx + dy * dy);
  return distance < c1.radius + c2.radius;
}

// Starta om spelet
function reset() {
  player.x = 100;
  player.y = 300;
  enemy.x = 700;
  enemy.y = 200;
  enemy.speedX = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 3);
  enemy.speedY = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 3);
}

// Huvudloopen
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Styra spelaren
  if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
  if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

  // Håll spelaren innanför canvas
  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

  // Fienden rör sig automatiskt
  enemy.x += enemy.speedX;
  enemy.y += enemy.speedY;

  // Studsa mot kanterna
  if (enemy.x <= enemy.radius || enemy.x >= canvas.width - enemy.radius) {
    enemy.speedX *= -1;
  }
  if (enemy.y <= enemy.radius || enemy.y >= canvas.height - enemy.radius) {
    enemy.speedY *= -1;
  }

  // Kollision → starta om
  if (collides(player, enemy)) {
    reset();
  }

  // Rita spelaren (grön)
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fillStyle = '#00ff88';
  ctx.fill();
  ctx.closePath();

  // Rita fienden (röd)
  ctx.beginPath();
  ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
  ctx.fillStyle = '#ff4444';
  ctx.fill();
  ctx.closePath();

  requestAnimationFrame(gameLoop);
}

// Starta spelet
reset();








  </script>
</body>
</html>
