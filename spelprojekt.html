       for (var rad = 0; rad < 4; rad++) {

    }
}

 if (tryckCooldown > 0) {
        tryckCooldown--;
      }
// detta komadot gör så spelaren kan röra sig till vänster höger upp och ner
      if (tryckCooldown == 0) {
        if (keyboard.up && playerRad > 0) {
          playerRad--;
          tryckCooldown = 8;
        }
        if (keyboard.down && playerRad < 5) {
          playerRad++;

        }

    byggnad[enemyRad][enemyKol]++;
  }
