<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
    // Skriv din kod här
    var player = { x: 50, y: 200, size: 40, color: "blue", speedX: 3, direction: 1, bounces: 0 };
    var x = 0
    function update() {
        
        clearScreen()
        picture(x, 0, "https://shorturl.at/9F9lR", totalWidth * 2, totalHeight)
        x--
        text(50, 50, 40, "Antal: " + player.bounces, "white")
        circle(player.x, player.y, player.size, player.color)
        player.x = player.x + player.speedX * player.direction

    if(player.x + player.size > totalWidth) {
        player.direction = -1
    }
    if(player.x - player.size < 0){
    player.direction = 1
    player.color = ByteLengthQueuingStrategy
    player.x = random(0, totalWidth)

    }
    }
  </script>
</body>
</html>
